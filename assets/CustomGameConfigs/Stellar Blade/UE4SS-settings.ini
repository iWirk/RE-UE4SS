; Stellar Blade uses a modified UE 4.26 Shipping engine, even when UE4SS itself is Debug.
[EngineVersionOverride]
MajorVersion = 4
MinorVersion = 26
DebugBuild = false
Stats = false

[General]
; Invalidate cached scan results when the installed DLL changes.
InvalidateCacheIfDLLDiffers = 1

[Debug]
; A second graphics window can be mistaken for the game by graphics injectors.
; Use logs, the text console, crash dumps and PDBs for this debug baseline.
ConsoleEnabled = 1
GuiConsoleEnabled = 0
GuiConsoleVisible = 0

[CrashDump]
EnableDumping = 1
; Enable for a reproducible crash when a minidump is insufficient (files can be very large).
FullMemoryDump = 0
